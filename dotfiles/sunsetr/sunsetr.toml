#[Backend]
backend = "wayland"      # Niri: Wayland color management (not Hyprsunset)
transition_mode = "geo"  # Sunrise/sunset from latitude & longitude (seasonal schedule)

#[Smoothing]
smoothing = true         # Enable smooth transitions during startup and exit
startup_duration = 1.0   # Gentle fade-in when Niri starts sunsetr
shutdown_duration = 1.0    # Gentle fade-out on exit
adaptive_interval = 1    # Adaptive interval base for smooth transitions (1-1000)ms

#[Time-based config]
night_temp = 3000        # Warm evening (~halogen); test with `sunsetr test 3000 88`
day_temp = 6500          # Neutral daylight
night_gamma = 88         # Slightly dimmer at night without crushing contrast
day_gamma = 100          # Full brightness by day
update_interval = "auto" # Per-step updates during geo transitions (JND-aware)

#[Static config]
static_temp = 6500       # Color temperature for static mode (1000-20000) Kelvin
static_gamma = 100       # Gamma percentage for static mode (10-200%)

#[Manual transitions]
sunset = "19:00:00"      # Time for manual sunset calculations (HH:MM:SS)
sunrise = "06:00:00"     # Time for manual sunrise calculations (HH:MM:SS)
transition_duration = 45 # Transition duration in minutes (5-120)

#[Geolocation]
latitude = 48.332807     # Geographic latitude (auto-detected on first run)
longitude = 15.764816    # Geographic longitude (use 'sunsetr geo' to change)
