# The Void
background_opacity 0.85

# Brutalist UI
window_padding_width 0
hide_window_decorations yes
confirm_os_window_close 0

# Palette lives in current-theme.conf (void by default; switch with `theme`)
allow_remote_control yes
include current-theme.conf

font_family      Iosevka
font_size        10.0

text_composition_strategy 1.5 30

symbol_map U+e000-U+e00a,U+e0a0-U+e0a3,U+e0b0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ea60-U+ebeb,U+f000-U+f2e0,U+f300-U+f32c,U+f400-U+f4a9,U+f500-U+f8ff,U+f0001-U+f1af0,U+1f40d,U+1f600-U+1f64f,U+1f000-U+1f9ff Symbols Nerd Font Mono

scrollback_pager nvim -c "set signcolumn=no showtabline=0" -c "silent! %s/\u001b\[[0-9;]*m//g" -c "set buftype=nofile"

remember_window_size no
initial_window_width 130c
initial_window_height 35c
