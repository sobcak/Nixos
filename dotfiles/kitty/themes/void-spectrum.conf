# Void Spectrum — void palette, more tones. No new hues.
# Black ground, #c5c8c6 text, #ff0000 accent, exactly like void. The difference
# is that every ANSI slot gets its own step on a grey ladder instead of
# collapsing onto #c5c8c6/#aaaaaa, so highlighting has depth without colour.
background #000000
foreground #c5c8c6

color0  #000000
color8  #555555

# the void accent, the only hue in the set
color1  #ff0000
color9  #ff5555

color2  #d9dcda
color10 #e3e6e4

color3  #cfd2d0
color11 #eef0ef

color4  #6b6b6b
color12 #808080

color5  #b3b3b3
color13 #bebebe

color6  #949494
color14 #a6a6a6

color7  #c5c8c6
color15 #ffffff
